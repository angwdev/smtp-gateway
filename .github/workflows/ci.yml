name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  go:
    runs-on: ubuntu-latest
    env:
      SMTPGW_LOCAL_GO: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Latest 1.27 patch release, not the go.mod minimum (1.27.0): govulncheck
          # reports standard-library fixes against the toolchain that runs it, and
          # the Dockerfile's golang:1.27-alpine also builds with the latest patch.
          go-version: '1.27.x'
          check-latest: true
      # Pebble (Let's Encrypt's test CA) lets the ACME test run the real DNS-01 flow.
      - run: |
          go install github.com/letsencrypt/pebble/v2/cmd/pebble@v2.10.1
          go install github.com/letsencrypt/pebble/v2/cmd/pebble-challtestsrv@v2.10.1
      - name: Generated mocks are up to date
        run: make generate && git diff --exit-code
      - run: make vet
      - run: make lint LINT="go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0"
      - run: make cover
      - run: make vuln

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run build
      - run: bun audit --audit-level=high

  image:
    needs: [go, ui]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write       # build provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # main -> latest + edge ; v1.2.3 -> 1.2.3, 1.2, 1 ; every build -> sha-<short>
          # (latest follows main so a release tag never moves it backwards)
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=edge,branch=main
            type=sha
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=smtp-gateway
            org.opencontainers.image.description=Credential-translating SMTP relay with an SSO control panel

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - uses: actions/attest-build-provenance@v4
        if: github.event_name != 'pull_request'
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
