version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard   # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - revive
    - misspell
    - unconvert
    - unparam
    - prealloc
    - copyloopvar
    - bodyclose
    - noctx
    - sqlclosecheck
    - gocritic
    - gosec
    - errorlint
    - depguard
  settings:
    revive:
      rules:
        - name: exported
          arguments: [checkPrivateReceivers]
        - name: blank-imports
        - name: context-as-argument
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: increment-decrement
        - name: var-naming
        - name: package-comments
          disabled: true
    gocritic:
      enabled-tags: [diagnostic, style, performance]
    gosec:
      excludes:
        - G104   # unhandled errors: covered by errcheck
    depguard:
      rules:
        domain:
          files: ["**/internal/domain/**"]
          deny:
            - { pkg: "github.com/angwdev/smtp-gateway/internal/application", desc: "domain must not import application" }
            - { pkg: "github.com/angwdev/smtp-gateway/internal/infrastructure", desc: "domain must not import infrastructure" }
            - { pkg: "github.com/angwdev/smtp-gateway/internal/interfaces", desc: "domain must not import interfaces" }
            - { pkg: "gorm.io", desc: "domain is framework-free" }
            - { pkg: "github.com/gin-gonic", desc: "domain is framework-free" }
        application:
          files: ["**/internal/application/**"]
          deny:
            - { pkg: "github.com/angwdev/smtp-gateway/internal/infrastructure", desc: "application depends on domain interfaces only" }
            - { pkg: "github.com/angwdev/smtp-gateway/internal/interfaces", desc: "application must not import interfaces" }
            - { pkg: "gorm.io", desc: "persistence belongs to infrastructure" }
            - { pkg: "github.com/gin-gonic", desc: "HTTP belongs to interfaces" }
        infrastructure:
          files: ["**/internal/infrastructure/**"]
          deny:
            - { pkg: "github.com/angwdev/smtp-gateway/internal/application", desc: "infrastructure implements domain interfaces" }
            - { pkg: "github.com/angwdev/smtp-gateway/internal/interfaces", desc: "infrastructure must not import interfaces" }
  exclusions:
    generated: lax
    paths:
      # v1 packages, deleted in Task 6.2. Remove these three lines there.
      - internal/store
      - internal/web
      - internal/proxy
    rules:
      - path: _test\.go
        linters: [gosec, errcheck, noctx, unparam]
      # Moved v1 code: keep correctness linters, skip style churn.
      - path: internal/infrastructure/(acme|tlsutil)/
        linters: [revive, gocritic, prealloc, unparam]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes: [github.com/angwdev/smtp-gateway]
